# Render Blueprint — web service only (matches ironmen / pro-trader pattern)
services:
  - type: web
    name: moon-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /api/health
    envVars:
      - key: MOON_SCANNER_DEPLOY
        value: render
      - key: PYTHON_VERSION
        value: "3.12.0"