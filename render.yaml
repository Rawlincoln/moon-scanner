# Render Blueprint — minimal web service (ironmen pattern)
services:
  - type: web
    name: moon-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start-render.sh
    envVars:
      - key: MOON_SCANNER_DEPLOY
        value: render
      - key: PYTHON_VERSION
        value: "3.12.0"