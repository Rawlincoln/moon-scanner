# Same structure as soccer-under-strategy / pro-trader (proven working on Rawlincoln account)
# Plan free by default; set plan: starter for always-on. Add HELIUS_API_KEY + ADMIN_API_KEY in dashboard.
services:
  - type: web
    name: moon-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /api/health
    envVars:
      - key: MOON_SCANNER_DEPLOY
        value: render
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: MOON_MODE
        value: balanced
      # Money-mode: MOON+SNIPE only, stop/TP on alerts, auto-CANCEL, trade journal
      - key: TELEGRAM_MONEY_MODE
        value: "1"
      # Durable SQLite root — set DATA_DIR=/var/data and attach a disk on Starter+
      # Free tier is ephemeral; GHA outcomes sync restores moon_outcomes across redeploys.
      - key: DATA_DIR
        value: data
      # Set real values in Render dashboard (do not commit secrets):
      # HELIUS_API_KEY, ADMIN_API_KEY, CORS_ORIGINS, TELEGRAM_*, TELEGRAM_CRON_SECRET
    # Persistent disk (requires paid plan). Uncomment when on Starter+:
    # disk:
    #   name: moon-scanner-data
    #   mountPath: /var/data
    #   sizeGB: 1
